# Деплой по средите.
#
# Път на промяната:
#   push към dev  →  pre-prod (Deimos)  →  smoke  →  merge в main  →  таг v*
#   →  (ръчно одобрение)  →  production (Phobos)  →  demo от същия таг
#
# Две машини (виж infra/README.md):
#   Phobos  169.58.72.254  само production
#   Deimos  169.58.90.87   pre-prod, demo, Availo dev
#
# Production се пуска САМО от таг, никога от клон — средата `prod` в GitHub е
# заключена за тагове `v*` и иска ръчно одобрение. Демото нарочно НЕ следва dev:
# то се показва на клиенти и върви от същия таг като production.
#
# Нужни secrets:
#   DEPLOY_SSH_KEY_PHOBOS   частен ключ на CI за Phobos
#   DEPLOY_SSH_KEY_DEIMOS   частен ключ на CI за Deimos
#   DEPLOY_HOST_PHOBOS      169.58.72.254
#   DEPLOY_HOST_DEIMOS      169.58.90.87
#   DEPLOY_USER             deploy
#   DEPLOY_KNOWN_HOSTS      изходът от `ssh-keyscan -t ed25519 <двата адреса>`
name: Деплой

on:
  push:
    branches: [dev]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Среда
        required: true
        default: preprod
        type: choice
        options: [preprod, demo, prod]
      ref:
        description: Git ref (за demo и prod задължително таг)
        required: false
        default: ""

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false        # деплой НЕ се прекъсва по средата

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Портата: без зелени тестове нищо не тръгва към сървър.
  # ─────────────────────────────────────────────────────────────────────────────
  gate:
    name: Проверки преди деплой
    uses: ./.github/workflows/integration.yml

  # ─────────────────────────────────────────────────────────────────────────────
  # Pre-prod на Deimos — тук dev има право да е счупен.
  # ─────────────────────────────────────────────────────────────────────────────
  preprod:
    name: Pre-prod (Deimos)
    needs: gate
    if: |
      github.ref == 'refs/heads/dev'
      || (github.event_name == 'workflow_dispatch' && inputs.environment == 'preprod')
    runs-on: ubuntu-latest
    environment:
      name: preprod
      url: http://169.58.90.87:8080/app/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: SSH достъп до Deimos
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY_DEIMOS }}" > ~/.ssh/id_deimos
          chmod 600 ~/.ssh/id_deimos
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deimos-deploy
              HostName ${{ secrets.DEPLOY_HOST_DEIMOS }}
              User ${{ secrets.DEPLOY_USER }}
              IdentityFile ~/.ssh/id_deimos
              IdentitiesOnly yes
          EOF

      - name: Деплой към pre-prod
        run: ./infra/deploy.sh preprod ${{ inputs.ref || github.sha }}

      - name: Smoke тестове
        run: |
          ssh deimos-deploy 'mkdir -p /tmp/ci'
          scp infra/ci/smoke.py deimos-deploy:/tmp/ci/smoke.py
          ssh deimos-deploy 'python3 /tmp/ci/smoke.py http://127.0.0.1:8080'

  # ─────────────────────────────────────────────────────────────────────────────
  # Production на Phobos: само от таг и само след ръчно одобрение. Репетицията
  # на миграциите върху КОПИЕ на реалната база е последната преграда пред
  # загуба на данни.
  # ─────────────────────────────────────────────────────────────────────────────
  prod:
    name: Production (Phobos)
    needs: gate
    if: |
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
    runs-on: ubuntu-latest
    environment:
      name: prod                    # изисква ръчно одобрение
      url: https://app.heppsu.com/app/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: SSH достъп до Phobos
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY_PHOBOS }}" > ~/.ssh/id_phobos
          chmod 600 ~/.ssh/id_phobos
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host phobos-deploy
              HostName ${{ secrets.DEPLOY_HOST_PHOBOS }}
              User ${{ secrets.DEPLOY_USER }}
              IdentityFile ~/.ssh/id_phobos
              IdentitiesOnly yes
          EOF

      # Репетицията иска ДВЕ неща, които досега не получаваше:
      #   1. образ, строен от ТОЗИ ref — подразбиращият се `aifos-api:aifos-preprod`
      #      на Phobos е остатък отпреди разделянето на машините и носи стар код;
      #   2. head-а на миграциите в ref-а, за да се докаже, че е пробван правилният
      #      образ. Без него зелена репетиция не значи нищо.
      - name: Репетиция на миграциите върху копие на production базата
        run: |
          HEAD_REV=$(python3 infra/ci/alembic_head.py apps/api/alembic/versions)
          echo "head на миграциите в ${{ github.ref_name }}: $HEAD_REV"

          # Образът се строи на Phobos от същия архив, който ще влезе в production.
          TARBALL=$(mktemp -t aifos-rehearse-XXXXXX.tar.gz)
          git archive --format=tar.gz -o "$TARBALL" HEAD apps infra
          scp -q "$TARBALL" phobos-deploy:/tmp/rehearse.tar.gz
          ssh phobos-deploy "rm -rf /tmp/rehearse && mkdir -p /tmp/rehearse \
            && tar -xzf /tmp/rehearse.tar.gz -C /tmp/rehearse \
            && docker build -q -t aifos-api:rehearse /tmp/rehearse/apps/api"

          ssh phobos-deploy "bash /tmp/rehearse/infra/ci/rehearse-migrations.sh \
            aifos-api:rehearse '' $HEAD_REV"

          ssh phobos-deploy "rm -rf /tmp/rehearse /tmp/rehearse.tar.gz \
            && docker image rm -f aifos-api:rehearse >/dev/null 2>&1 || true"

      - name: Деплой към production
        run: ./infra/deploy.sh prod ${{ inputs.ref || github.ref_name }}

      - name: Smoke тестове (само четящи)
        run: |
          ssh phobos-deploy 'mkdir -p /tmp/ci'
          scp infra/ci/smoke.py phobos-deploy:/tmp/ci/smoke.py
          ssh phobos-deploy 'python3 /tmp/ci/smoke.py http://127.0.0.1:80 --read-only'

      - name: Домейнът отговаря
        run: |
          curl -fsS -o /dev/null -w 'heppsu.com → %{http_code}\n' https://heppsu.com/
          curl -fsS -o /dev/null -w 'app.heppsu.com → %{http_code}\n' https://app.heppsu.com/api/v1/health

  # ─────────────────────────────────────────────────────────────────────────────
  # Демо на Deimos — само ръчно и само от таг, после пълно пресъздаване:
  # демото никога не носи вчерашни данни, нито днешния счупен комит.
  # ─────────────────────────────────────────────────────────────────────────────
  demo:
    name: Demo (Deimos)
    needs: gate
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'demo'
    runs-on: ubuntu-latest
    environment:
      name: preprod
      url: http://169.58.90.87:8081/app/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Демото се пуска само от таг
        run: |
          REF="${{ inputs.ref || github.ref_name }}"
          case "$REF" in
            v*) echo "таг $REF — добре" ;;
            *)  echo "Демото се деплойва само от таг v*, а не от '$REF'." >&2
                echo "То се показва на клиенти и не бива да следва клон." >&2
                exit 1 ;;
          esac

      - name: SSH достъп до Deimos
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY_DEIMOS }}" > ~/.ssh/id_deimos
          chmod 600 ~/.ssh/id_deimos
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deimos-deploy
              HostName ${{ secrets.DEPLOY_HOST_DEIMOS }}
              User ${{ secrets.DEPLOY_USER }}
              IdentityFile ~/.ssh/id_deimos
              IdentitiesOnly yes
          EOF

      - name: Деплой към demo
        run: ./infra/deploy.sh demo ${{ inputs.ref || github.ref_name }}

      - name: Пресъздаване с измислени данни
        run: ssh deimos-deploy 'bash /srv/aifos/demo/release/infra/demo/recreate.sh'
