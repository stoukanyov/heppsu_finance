# Проверки, които доказват съвместимост с PRODUCTION.
#
# `api.yml` пуска бързите проверки (линтер, тестове на SQLite). Този поток пуска
# бавните и по-важните: същите тестове срещу истински PostgreSQL, пазача на
# миграциите и репетиция на миграциите върху копие на реалната схема.
#
# Причина да са отделен файл: пада ли бързият поток, няма смисъл да се чака 10
# минути за бавния — а и двата се разработват независимо.
name: Интеграция

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Същите тестове, но срещу базата, която работи в production. SQLite прощава
  # неща, които PostgreSQL не прощава: типове, ограничения, транзакционен DDL,
  # сортиране, точност на Numeric. Тест, минал само на SQLite, не доказва нищо.
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    name: Тестове срещу PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aifos_test
        options: >-
          --health-cmd "pg_isready -U test -d aifos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports: ["5432:5432"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Инсталиране
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Тестове срещу PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/aifos_test
        run: pytest -q -p no:warnings

      - name: Миграциите минават от нула върху PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/aifos_migrate
          SECRET_KEY: ci-secret-key-not-used-anywhere
          ENVIRONMENT: test
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://test:test@localhost:5432/postgres", autocommit=True) as c:
              c.execute("DROP DATABASE IF EXISTS aifos_migrate")
              c.execute("CREATE DATABASE aifos_migrate")
          PY
          alembic upgrade head
          alembic check          # моделите и миграциите не се разминават

  # ─────────────────────────────────────────────────────────────────────────────
  # Счетоводните данни се пазят 10 години по ЗСч. Една забравена `drop_column`
  # ги отнася безвъзвратно, а се вижда чак когато дойде ревизия.
  # ─────────────────────────────────────────────────────────────────────────────
  migrations-guard:
    name: Пазач на миграциите
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # нужна е историята, за да се види кое е ново

      - name: Разрушителни операции без разрешение
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'origin/main' }}"
          git fetch origin main --quiet || true
          python infra/ci/check_migrations.py --since "$BASE" \
            || python infra/ci/check_migrations.py

  # ─────────────────────────────────────────────────────────────────────────────
  # Сигурност: уязвими зависимости и опасни конструкции в кода.
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Сигурност
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Инсталиране
        run: pip install bandit==1.9.4 pip-audit==2.10.1

      - name: Уязвими зависимости
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Опасни конструкции
        # Средно и високо ниво спират потока; ниските са шум (напр. dev ключът
        # по подразбиране, който така или иначе е забранен в production).
        run: bandit -q -r app --severity-level medium
