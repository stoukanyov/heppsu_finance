# Правила за кода ИЗВЪН `apps/api` — най-вече скриптовете в `infra/`.
#
# Кодът на API-то има собствен `apps/api/ruff.toml`; ruff избира най-близкия
# конфигурационен файл, тъй че двата не се застъпват. Наборът правила тук е
# същият нарочно: скриптовете в `infra/` пипат production — deploy, миграции,
# smoke тестове — и грешка там струва колкото грешка в приложението.

line-length = 120
target-version = "py312"

[lint]
select = [
    "F",      # недефинирани имена, мъртви импорти
    "E9",     # синтактични грешки
    "W",
    "B",      # bugbear
    "UP",
    "SIM",
    "I",
    "S",      # правилата на bandit
    "ASYNC",
    "DTZ",    # дата/час без часова зона
]
ignore = [
    # `assert` е формата на проверката в smoke скриптовете — там точно това се
    # прави: твърдение за разгърнатата среда.
    "S101",
    # `raise ... from` — както в `apps/api/ruff.toml`: правилно, но пипането на
    # работещ код носи повече риск, отколкото полза.
    "B904",
]

[lint.per-file-ignores]
# `git diff` се вика със списък от аргументи (без обвивка), а `since` е git ref,
# подаден от CI, не от потребител. Пълен път до `git` не се задава нарочно:
# скриптът трябва да работи и локално, и в контейнера, където `git` е на различни
# места.
"infra/ci/check_migrations.py" = ["S603", "S607"]
# Демо генераторът ползва `random` за измислени суми и дати. Стойностите не пазят
# нищо — точно обратното, детерминирани са (`random.seed`), за да изглежда демото
# еднакво при всяко пресъздаване. Криптографски генератор тук би бил грешка.
"infra/demo/seed_demo.py" = ["S311"]
# Паролата в smoke теста е за акаунт, който самият тест създава в dev среда и
# който в production изобщо не се създава (`--read-only`).
"infra/ci/smoke.py" = ["S105"]
