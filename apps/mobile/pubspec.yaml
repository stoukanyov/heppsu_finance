name: heppsu_finance
description: "Heppsu Finance — мобилен клиент към AI Finance OS (сканиране, одобрения)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management / DI
  flutter_riverpod: ^2.6.1

  # Мрежа
  dio: ^5.7.0

  # Сигурно съхранение на JWT / избрана компания
  flutter_secure_storage: ^9.2.2

  # Навигация
  go_router: ^14.6.2

  # Сканиране / изображения
  image_picker: ^1.1.2
  image: ^4.3.0

  # Помощни
  crypto: ^3.0.6
  path_provider: ^2.1.5
  intl: ^0.20.2
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
