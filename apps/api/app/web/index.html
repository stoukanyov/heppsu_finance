<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Finance OS</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #111827; --ink-2:#1f2430; --muted: #6b7280; --muted-2:#9ca3af;
    --line: #edeef1; --line-2:#e5e7eb;
    --accent: #5b52e6; --accent-2:#6d64f2; --accent-soft: #eef0fe; --accent-ink:#4b43d6;
    --good: #16a34a; --good-soft:#e7f6ec; --bad: #dc2626; --bad-soft:#fdecec; --warn: #d97706; --warn-soft:#fdf3e6;
    --info:#2563eb; --info-soft:#e8f0fe;
    --radius: 14px; --radius-sm:10px;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.05);
    --shadow-sm: 0 1px 2px rgba(16,24,40,.06);
  }
  * { box-sizing: border-box; }
  html,body { height:100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing:antialiased; }
  a { color: var(--accent); text-decoration: none; }
  h1,h2,h3,h4 { margin: 0; font-weight: 650; letter-spacing:-.01em; }
  h2 { font-size: 20px; } h3 { font-size: 15px; } h4{font-size:13px;}
  svg { display:block; }

  button { font: inherit; cursor: pointer; border: 1px solid var(--line-2); background: #fff;
    padding: 9px 14px; border-radius: var(--radius-sm); color: var(--ink-2); transition: .12s; font-weight:500;
    display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
  button:hover { border-color: #d3d6db; background: #fafbfc; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow:0 1px 2px rgba(91,82,230,.3); }
  button.primary:hover { background: var(--accent-ink); border-color:var(--accent-ink); }
  button.ghost { border-color: transparent; background: transparent; color:var(--muted); padding:8px; }
  button.ghost:hover { background:#f0f1f4; color:var(--ink); }
  button.sm { padding:6px 10px; font-size:12.5px; }
  button:disabled { opacity: .5; cursor: default; }
  .icon-btn { width:38px; height:38px; padding:0; justify-content:center; border-radius:10px; border-color:transparent; background:transparent; color:var(--muted); }
  .icon-btn:hover { background:#f0f1f4; color:var(--ink); }

  input, select, textarea { font: inherit; padding: 9px 11px; border: 1px solid var(--line-2);
    border-radius: var(--radius-sm); background: #fff; color: var(--ink); width: 100%; transition:.12s; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 5px; font-weight:500; }
  .field { margin-bottom: 12px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); padding: 20px; }
  .card-t { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .muted { color: var(--muted); } .muted-2{color:var(--muted-2);}
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--line); }
  thead th { font-size: 11.5px; color: var(--muted-2); font-weight: 600; text-transform:uppercase; letter-spacing:.03em;
    border-bottom:1px solid var(--line-2); }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr:hover { background:#fafbfc; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.strong { font-weight:600; color:var(--ink); }

  .pill { display: inline-flex; align-items:center; gap:5px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight:600; background:#f1f2f5; color:#4b5563; }
  .pill::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.8;}
  .pill.na::before{display:none;}
  .s-green{ background:var(--good-soft); color:#15803d;} .s-red{background:var(--bad-soft);color:#b91c1c;}
  .s-amber{background:var(--warn-soft);color:#b45309;} .s-violet{background:var(--accent-soft);color:var(--accent-ink);}
  .s-blue{background:var(--info-soft);color:#1d4ed8;} .s-gray{background:#f1f2f5;color:#4b5563;}

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items:center; margin-bottom: 18px; }
  .grow{flex:1;} .spacer{flex:1;}
  .stack > * + * { margin-top: 16px; }
  .flex { display: flex; gap: 10px; align-items: center; }
  .spread { justify-content: space-between; }
  .grid { display:grid; gap:16px; }
  .badge-ok { color: var(--good); font-weight:600; } .badge-bad { color: var(--bad); font-weight:600; }
  .hint{ font-size:12px; color:var(--muted-2); }

  /* Auth */
  #auth { min-height: 100vh; display: grid; place-items: center; padding: 20px;
    background: radial-gradient(1200px 500px at 50% -10%, #eef0fe, transparent), var(--bg); }
  #auth .card { width: 380px; box-shadow:var(--shadow); }
  .brand { font-weight: 750; letter-spacing: -.03em; display:flex; align-items:center; gap:9px; }
  .brand .logo{ width:30px;height:30px;border-radius:9px; background:linear-gradient(135deg,var(--accent),#8b7bf5);
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px; box-shadow:0 2px 8px rgba(91,82,230,.35);}

  /* Shell */
  #shell { display: none; grid-template-columns: 244px 1fr; min-height: 100vh; }
  aside { background: #fff; border-right:1px solid var(--line); padding: 16px 14px; display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; overflow-y:auto; }
  aside .brand { font-size:16px; padding:6px 8px 18px; color:var(--ink); }
  .nav-sec{ font-size:10.5px; font-weight:700; color:var(--muted-2); letter-spacing:.08em; text-transform:uppercase; padding:14px 12px 6px; }
  nav a { display: flex; align-items:center; gap:11px; padding: 9px 12px; border-radius: 10px; color: var(--ink-2);
    margin-bottom: 1px; font-weight:500; font-size:13.5px; }
  nav a svg{ width:18px;height:18px; color:var(--muted); flex:none; }
  nav a:hover { background:#f5f6f8; }
  nav a.active { background: var(--accent-soft); color: var(--accent-ink); font-weight:600; }
  nav a.active svg{ color:var(--accent); }
  .side-foot{ margin-top:auto; padding-top:14px; border-top:1px solid var(--line); }
  .userchip{ display:flex; align-items:center; gap:10px; padding:8px; border-radius:10px; }
  .avatar{ width:34px;height:34px;border-radius:9px; background:linear-gradient(135deg,#5b52e6,#8b7bf5); color:#fff;
    display:grid;place-items:center;font-weight:700;font-size:14px; flex:none;}
  .avatar.sm{width:30px;height:30px;font-size:12px;border-radius:8px;}

  header.topbar { display: flex; justify-content: space-between; align-items: center; gap:16px;
    padding: 12px 28px; border-bottom: 1px solid var(--line); background: #fff; position:sticky; top:0; z-index:20; }
  .search{ position:relative; flex:1; max-width:420px; }
  .search svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); width:17px;height:17px; color:var(--muted-2); }
  .search input{ padding-left:36px; background:#f5f6f8; border-color:transparent; }
  .search input:focus{ background:#fff; }
  .topbar-r{ display:flex; align-items:center; gap:6px; }
  .company-sel{ display:flex; align-items:center; gap:8px; padding:6px 10px 6px 8px; border:1px solid var(--line-2); border-radius:10px; }
  .company-sel select{ border:none; padding:2px 4px; width:auto; font-weight:600; background:transparent; }
  .company-sel select:focus{box-shadow:none;}

  main { padding: 26px 28px; max-width: 1240px; }
  .page-h{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
  .page-h .sub{ color:var(--muted); font-size:13.5px; margin-top:3px; }

  /* KPI */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
  .kpi{ padding:18px; }
  .kpi .top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .kpi .chip{ width:40px;height:40px;border-radius:11px; display:grid;place-items:center; }
  .kpi .chip svg{width:20px;height:20px;}
  .kpi .l{ font-size:13px; color:var(--muted); font-weight:500; }
  .kpi .v{ font-size:25px; font-weight:700; letter-spacing:-.02em; margin-top:2px; }
  .delta{ font-size:12px; font-weight:600; display:inline-flex; align-items:center; gap:3px; padding:3px 7px; border-radius:7px; }
  .delta.up{ color:var(--good); background:var(--good-soft);} .delta.down{ color:var(--bad); background:var(--bad-soft);}
  .c-violet{background:var(--accent-soft);color:var(--accent);} .c-green{background:var(--good-soft);color:var(--good);}
  .c-red{background:var(--bad-soft);color:var(--bad);} .c-blue{background:var(--info-soft);color:var(--info);}
  .c-amber{background:var(--warn-soft);color:var(--warn);} .c-teal{background:#e6f6f4;color:#0d9488;}

  .cols{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .cols-3{ display:grid; grid-template-columns:2fr 1fr; gap:16px; }
  @media(max-width:900px){ .cols,.cols-3{grid-template-columns:1fr;} #shell{grid-template-columns:1fr;} aside{display:none;} }

  .legend{ display:flex; flex-direction:column; gap:9px; }
  .legend .li{ display:flex; align-items:center; justify-content:space-between; font-size:13px; }
  .legend .dot{ width:9px;height:9px;border-radius:3px; display:inline-block; margin-right:8px; }
  .bar-row{ margin-bottom:12px; } .bar-row:last-child{margin-bottom:0;}
  .bar-row .lab{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px; }
  .bar{ height:9px; border-radius:6px; background:#eef0f3; overflow:hidden; }
  .bar > span{ display:block; height:100%; border-radius:6px; }

  .check li{ list-style:none; padding:7px 0; display:flex; gap:9px; align-items:flex-start; border-bottom:1px solid var(--line); }
  .check{ padding:0; margin:0; } .check li:last-child{border-bottom:none;}
  .check svg{ width:17px;height:17px; color:var(--good); flex:none; margin-top:1px; }

  .steps{ display:flex; align-items:center; gap:6px; margin-bottom:20px; flex-wrap:wrap; }
  .step{ display:flex; align-items:center; gap:8px; padding:7px 13px; border-radius:999px; background:#f2f3f6; color:var(--muted); font-size:12.5px; font-weight:600; }
  .step .n{ width:20px;height:20px;border-radius:50%; background:#dfe1e7; color:#fff; display:grid;place-items:center; font-size:11px; }
  .step.active{ background:var(--accent-soft); color:var(--accent-ink);} .step.active .n{ background:var(--accent);}
  .step.done{ background:var(--good-soft); color:#15803d;} .step.done .n{ background:var(--good);}
  .step-sep{ width:16px;height:2px;background:#e3e5ea;border-radius:2px;}

  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line-2); margin-bottom:16px; flex-wrap:wrap; }
  .tab{ padding:9px 14px; font-size:13.5px; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; cursor:pointer; margin-bottom:-1px; }
  .tab:hover{ color:var(--ink); } .tab.active{ color:var(--accent-ink); border-bottom-color:var(--accent); }

  .empty{ text-align:center; color:var(--muted-2); padding:34px 10px; }
  .empty svg{ width:34px;height:34px; margin-bottom:8px; opacity:.5; }
  .drop{ border:1.5px dashed var(--line-2); border-radius:var(--radius); padding:22px; text-align:center; color:var(--muted); background:#fafbfc; }

  #toast { position: fixed; bottom: 22px; right: 22px; max-width: 380px; z-index: 90; }
  .toast { background: #111827; color: #fff; padding: 12px 16px; border-radius: 11px; box-shadow: 0 8px 30px rgba(0,0,0,.2); margin-top: 10px; display:flex; gap:9px; align-items:center; font-weight:500; }
  .toast svg{width:18px;height:18px;flex:none;}
  .toast.err { background: #b91c1c; }
  .spin{ animation:sp 1s linear infinite; } @keyframes sp{to{transform:rotate(360deg);}}
  .skel{ background:linear-gradient(90deg,#eef0f3 25%,#f6f7f9 50%,#eef0f3 75%); background-size:200% 100%; animation:sh 1.3s infinite; border-radius:8px; height:14px; }
  @keyframes sh{to{background-position:-200% 0;}}
</style>
</head>

        <div class="company-sel">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="var(--muted)" stroke-width="2"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/></svg>

        </div>

        <div class="avatar sm" id="top-avatar" title="Изход" style="cursor:pointer;">?</div>
      </div>
    </header>
    <main id="main"></main>
  </div>
</div>

<div id="toast"></div>

function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function fmt(n){ return new Intl.NumberFormat('bg-BG',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n||0)); }
function fmt0(n){ return new Intl.NumberFormat('bg-BG',{maximumFractionDigits:0}).format(Number(n||0)); }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function initials(s){ return (String(s||'?').trim().split(/[\s@.]+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('')||'?').toUpperCase(); }
function toast(msg, err){

async function api(path,{method='GET',body,form}={}){
  const headers={}; if(token) headers['Authorization']='Bearer '+token; if(companyId) headers['X-Company-Id']=companyId;
  const opts={method,headers};
  if(form) opts.body=form; else if(body!==undefined){ headers['Content-Type']='application/json'; opts.body=JSON.stringify(body); }
  const res=await fetch(API+path,opts); const text=await res.text();
  let data=null; try{ data=text?JSON.parse(text):null; }catch{ data=text; }
  if(!res.ok){ const msg=(data&&data.detail)?(Array.isArray(data.detail)?data.detail.map(d=>d.msg).join('; '):data.detail):('Грешка '+res.status); throw new Error(msg); }
  return data;
}
async function blobDownload(path, filename){
  const res=await fetch(API+path,{headers:{Authorization:'Bearer '+token,'X-Company-Id':companyId}});
  if(!res.ok){ toast('Грешка при генериране на файла',true); return; }
  const url=URL.createObjectURL(await res.blob()); const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000); toast(filename+' е свален');
}

/* donut chart from [{label,value,color}] */
function donut(items, size=150){
  const total=items.reduce((s,i)=>s+Math.max(0,i.value),0)||1; const r=54, C=2*Math.PI*r; let off=0;
  const segs=items.map(it=>{ const len=Math.max(0,it.value)/total*C; const s=`<circle cx="75" cy="75" r="${r}" fill="none" stroke="${it.color}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`; off+=len; return s; }).join('');
  return `<svg viewBox="0 0 150 150" width="${size}" height="${size}"><circle cx="75" cy="75" r="${r}" fill="none" stroke="#eef0f3" stroke-width="18"/>${segs}</svg>`;
}

    const curFrom=iso(new Date(now.getFullYear(),now.getMonth(),1)), curTo=iso(now);
    const prevFrom=iso(new Date(now.getFullYear(),now.getMonth()-1,1)), prevTo=iso(new Date(now.getFullYear(),now.getMonth(),0));
    let ck={}, pk={}, pnl=null, docs=[];

    } else { donutHtml=empty('Няма осчетоводени разходи'); }

    // Приходи / Разходи / Печалба барове
    let barsHtml='';
    if(pnl){ const rev=Number(pnl.revenue.total), exp=Number(pnl.expenses.total), pr=Number(pnl.net_profit); const mx=Math.max(rev,exp,Math.abs(pr),1);

        ${kpi('Приходи (месец)',ck.revenue,pk.revenue,'in','c-green',true)}
        ${kpi('Разходи (месец)',ck.expenses,pk.expenses,'out','c-amber',false)}
        ${kpi('Печалба (месец)',ck.profit,pk.profit,'trend',Number(ck.profit)>=0?'c-teal':'c-red',true)}
        ${kpi('Вземания',ck.receivables,pk.receivables,'wallet','c-blue',true)}

      <div class="cols" style="margin-bottom:16px;">
        <div class="card"><div class="card-t"><h3>Приходи срещу разходи</h3><span class="pill s-violet na">ОПР текущ период</span></div>${barsHtml}</div>

    box.querySelectorAll('.do-match').forEach(b=>b.onclick=async()=>{ try{ await api(`/banking/transactions/${b.dataset.tx}/match`,{method:'POST',body:{journal_entry_id:b.dataset.je}}); toast('Съпоставено'); box.innerHTML=''; loadTx(); }catch(e){ toast(e.message,true); } });

}

async function viewStores(main){
  const now=new Date(); const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const from=iso(new Date(now.getFullYear(),now.getMonth()-2,1)), to=iso(now);
  let st={}; try{ st=await api('/stores/status'); }catch{}
  const modePill = st.provider==='live' ? '<span class="pill s-green">Live · свързан</span>' : '<span class="pill s-amber">Демо данни (stub)</span>';
  main.innerHTML=pageH('Магазини · App Store / Google Play','Продажби, най-добри приложения и държави',modePill)+`
    <div class="card" style="margin-bottom:16px;"><div class="row">
      <div class="field"><label>Магазин</label><select id="s-plat"><option value="APP_STORE">App Store</option><option value="GOOGLE_PLAY">Google Play</option><option value="BOTH">И двата</option></select></div>
      <div class="field"><label>От дата</label><input id="s-from" type="date" value="${from}"/></div>
      <div class="field"><label>До дата</label><input id="s-to" type="date" value="${to}"/></div>

    </div></div>
    <div id="s-body">${loading()}</div>`;
  document.getElementById('s-sync').onclick=async()=>{
    const plat=document.getElementById('s-plat').value, f=document.getElementById('s-from').value, t=document.getElementById('s-to').value;
    const plats = plat==='BOTH'?['APP_STORE','GOOGLE_PLAY']:[plat];
    document.getElementById('s-sync').disabled=true;
    try{ let imp=0; for(const p of plats){ const r=await api(`/stores/${p}/sync?date_from=${f}&date_to=${t}`,{method:'POST'}); imp+=r.imported; } toast(`Синхронизирани ${imp} нови реда`); loadStores(); }

  const loadStores=async()=>{
    const box=document.getElementById('s-body'); box.innerHTML=loading();
    try{
      const a=await api('/stores/analytics');
      if(!a.total_units){ box.innerHTML=`<div class="card">${empty('Няма данни още. Натисни „Синхронизирай", за да заредиш продажби.')}</div>`; return; }
      const cur=a.currency;

async function viewVat(main){
  let years=[]; try{ years=await api('/accounting/fiscal-years'); }catch(e){ main.innerHTML=pageH('ДДС','')+`<div class="card">${empty(e.message)}</div>`; return; }

  if(!periods.length){ main.innerHTML=pageH('ДДС / Декларация','')+`<div class="card">${empty('Няма данъчен период. Създай фискална година в „Счетоводство".')}</div>`; return; }
  periods.sort((a,b)=>b.code.localeCompare(a.code));
  main.innerHTML=pageH('ДДС / Справка-декларация по ЗДДС','Изчисляване и подаване на файловете за НАП')+`

    <div class="toolbar"><div class="field" style="margin:0;min-width:180px;"><label>Данъчен период</label><select id="v-period">${periods.map(p=>`<option value="${p.id}">${esc(p.code)}</option>`).join('')}</select></div>
      <button id="v-load" class="primary" style="align-self:flex-end;">Изчисли декларация</button>
      <button id="v-nap" style="align-self:flex-end;">${ic('download')}Файлове за НАП (.zip)</button>
      <button id="v-close" style="align-self:flex-end;border-color:var(--good);color:var(--good);">${ic('check')}Приключи ДДС период</button></div>
    <div id="v-result">${loading()}</div>`;
  const load=()=>loadVatDeclaration(document.getElementById('v-period').value);
  document.getElementById('v-load').onclick=load; document.getElementById('v-period').onchange=load;
  document.getElementById('v-nap').onclick=()=>{ const s=document.getElementById('v-period'); blobDownload(`/vat/returns/${s.value}/nap-files`,`NAP-DDS-${s.selectedOptions[0].text.replace('-','')}.zip`); };
  document.getElementById('v-close').onclick=async()=>{
    const s=document.getElementById('v-period');
    if(!confirm(`Приключване на ДДС период ${s.selectedOptions[0].text}? Ще се осчетоводи резултатът и периодът се заключва за ДДС.`)) return;
    try{ const c=await api(`/vat/periods/${s.value}/close`,{method:'POST'}); toast(`Приключен · за внасяне ${fmt(c.net_payable)} / за възстановяване ${fmt(c.net_refundable)}`); load(); }
    catch(e){ toast(e.message,true); } };
  load();
}
async function loadVatDeclaration(pid){
  const box=document.getElementById('v-result'); if(!box) return; box.innerHTML=loading();
  try{ const d=await api(`/vat/returns/${pid}/declaration`);
    let closing=null; try{ closing=await api(`/vat/periods/${pid}/closing`); }catch{}
    const cell=n=>{ const c=d.cells.find(x=>x.cell===n); return c?Number(c.amount):0; };
    const payable=cell('50'), refundable=cell('60');
    const errs=d.controls.filter(c=>c.level==='ERROR'), warns=d.controls.filter(c=>c.level!=='ERROR');
    const closedBanner = closing ? `<div class="card" style="margin-bottom:16px;border-color:var(--good);background:var(--good-soft);"><div class="flex spread"><div class="flex">${ic('check')}<b style="color:#15803d;">Периодът е приключен и осчетоводен</b></div><span class="pill s-green na">за внасяне ${fmt(closing.net_payable)} · за възстановяване ${fmt(closing.net_refundable)}</span></div></div>` : '';
    const cb=document.getElementById('v-close'); if(cb){ cb.disabled=!!closing; cb.style.opacity=closing?'.5':'1'; }
    box.innerHTML=closedBanner+`<div class="cols" style="margin-bottom:16px;">
        <div class="card kpi"><div class="top"><div><div class="l">ДДС за внасяне (к.50)</div><div class="v">${fmt(payable)}</div></div><div class="chip c-red">${ic('out')}</div></div></div>
        <div class="card kpi"><div class="top"><div><div class="l">ДДС за възстановяване (к.60)</div><div class="v">${fmt(refundable)}</div></div><div class="chip c-green">${ic('in')}</div></div></div></div>
      <div class="card" style="margin-bottom:16px;"><div class="card-t"><h3>Контроли и предупреждения</h3>${d.has_blocking_errors?'<span class="pill s-red">Има грешки</span>':'<span class="pill s-green">Готово за подаване</span>'}</div>
        <ul class="check">${errs.map(c=>`<li style="color:var(--bad)">${ic('alert')}<span style="color:var(--ink-2)">${esc(c.message)}</span></li>`).join('')}
        ${warns.map(c=>`<li style="color:var(--warn)">${ic('alert')}<span style="color:var(--ink-2)">${esc(c.message)}</span></li>`).join('')}
        ${!d.controls.length?`<li>${ic('check')}<span>Всички задължителни полета са попълнени. Няма несъответствия.</span></li>`:''}</ul></div>
      <div class="card"><div class="card-t"><h3>Клетки — ${esc(d.company_name)} · период ${esc(d.period_code)}</h3></div>
        <table><thead><tr><th>Клетка</th><th>Описание</th><th class="num">Стойност</th></tr></thead><tbody>${d.cells.map(c=>`<tr><td class="strong">${esc(c.cell)}</td><td>${esc(c.label)}</td><td class="num">${fmt(c.amount)}</td></tr>`).join('')}</tbody></table>
        <div class="hint" style="margin-top:10px;">Пакетът за НАП: POKUPKI.TXT, PRODAGBI.TXT, DEKLAR.TXT (+ VIES.TXT при ВОД), кодиране Windows-1251.</div></div>`;
  }catch(e){ box.innerHTML=`<div class="card">${empty(e.message)}</div>`; }
}

/* ==================== AI АНАЛИЗИ (CFO) ==================== */
async function viewAnalytics(main){
  main.innerHTML=pageH('AI Анализи','AI CFO — анализ и препоръки върху вашите финансови данни')+`
    <div class="card" style="margin-bottom:16px;"><div class="field"><label>Въпрос към AI CFO (по избор)</label>
      <textarea id="q-text" rows="2" placeholder="напр. Как да подобря паричния поток? Има ли данъчни рискове?"></textarea></div>
      <button id="q-ask" class="primary">${ic('brain')}Анализирай</button></div>
    <div id="q-out"></div>`;
  document.getElementById('q-ask').onclick=async()=>{
    const out=document.getElementById('q-out'); out.innerHTML=loading();
    try{ const a=await api('/ai/cfo/ask',{method:'POST',body:{question:document.getElementById('q-text').value||null}});
      out.innerHTML=`<div class="card stack">
        <div class="card-t"><div class="flex">${ic('brain')}<h3 style="margin-left:2px;">${esc(a.summary)}</h3></div><span class="pill s-violet na">увереност: ${esc(a.confidence)}</span></div>
        <div style="color:var(--ink-2)">${esc(a.explanation)}</div>
        ${a.recommendations?.length?`<div><h4 class="muted" style="margin-bottom:6px;">Препоръки</h4><ul class="check">${a.recommendations.map(r=>`<li>${ic('check')}<span>${esc(r)}</span></li>`).join('')}</ul></div>`:''}
        ${a.risks?.length?`<div><h4 class="muted" style="margin-bottom:6px;">Рискове</h4><ul class="check">${a.risks.map(r=>`<li style="color:var(--warn)">${ic('alert')}<span style="color:var(--ink-2)">${esc(r)}</span></li>`).join('')}</ul></div>`:''}
        ${a.assumptions?.length?`<div class="hint">Допускания: ${a.assumptions.map(esc).join('; ')}</div>`:''}</div>`;
    }catch(e){ out.innerHTML=`<div class="card">${empty(e.message)}</div>`; }
  };
}

/* ==================== ДОКУМЕНТИ ==================== */
async function viewDocuments(main){
  main.innerHTML=pageH('Документи','Качване, мобилно сканиране и AI разпознаване')+`
    <div class="cols" style="margin-bottom:16px;">
      <div class="card"><h3 style="margin-bottom:12px;">Качи документ</h3>
        <div class="row"><div class="field grow"><label>PDF или изображение</label><input id="doc-file" type="file" accept="application/pdf,image/*"/></div>
        <button id="doc-up" class="primary">Качи</button></div>
        <div class="hint">Файлът се пази и се обработва с „AI извличане".</div></div>
      <div class="card"><h3 style="margin-bottom:12px;">${ic('scan')} Сканиране (мобилен поток)</h3>
        <div class="row"><div class="field grow"><label>Снимка/скан на фактура</label><input id="scan-file" type="file" accept="image/*,application/pdf"/></div>
        <button id="scan-btn" class="primary">Сканирай + OCR</button></div>
        <div class="hint">Едно действие: качва изображението и веднага го разпознава (source=MOBILE).</div></div>
    </div>
    <div class="card"><div class="card-t"><h3>Списък</h3></div><div id="doc-list">${loading()}</div></div>
    <div id="doc-detail"></div>`;
  document.getElementById('doc-up').onclick=async()=>{
    const f=document.getElementById('doc-file').files[0]; if(!f){ toast('Избери файл',true); return; }
    const fd=new FormData(); fd.append('file',f);
    try{ await api('/documents',{method:'POST',form:fd}); toast('Документът е качен'); loadDocs(); }catch(e){ toast(e.message,true); } };
  document.getElementById('scan-btn').onclick=async()=>{
    const f=document.getElementById('scan-file').files[0]; if(!f){ toast('Избери снимка/скан',true); return; }
    const fd=new FormData(); fd.append('file',f); const btn=document.getElementById('scan-btn'); btn.disabled=true; btn.textContent='OCR…';
    try{ const r=await api('/documents/scan',{method:'POST',form:fd}); toast('Сканирано и разпознато'); showExtraction(r.extraction); loadDocs(); }
    catch(e){ toast(e.message,true); } finally{ btn.disabled=false; btn.textContent='Сканирай + OCR'; } };
  loadDocs();
}
async function loadDocs(){
  const box=document.getElementById('doc-list'); if(!box) return;
  const docs=await api('/documents');
  if(!docs.length){ box.innerHTML=empty('Няма документи.'); return; }
  box.innerHTML=`<table><thead><tr><th>Файл</th><th>Източник</th><th>Статус</th><th class="num">Действия</th></tr></thead><tbody>
    ${docs.map(d=>`<tr><td class="strong">${esc(d.original_filename)}</td><td>${pill(d.source)}</td><td>${pill(d.status)}</td>
      <td class="num"><div class="flex" style="justify-content:flex-end;gap:6px;"><button class="icon-btn dl" data-id="${d.id}" title="Изтегли">${ic('download')}</button><button class="sm extract" data-id="${d.id}">AI извличане</button></div></td></tr>`).join('')}</tbody></table>`;
  box.querySelectorAll('.extract').forEach(b=>b.onclick=async()=>{ b.disabled=true; b.textContent='Обработва…';
    try{ const r=await api(`/ai/documents/${b.dataset.id}/extract`,{method:'POST'}); showExtraction(r); loadDocs(); }
    catch(e){ toast(e.message,true); b.disabled=false; b.textContent='AI извличане'; } });
  box.querySelectorAll('.dl').forEach(b=>b.onclick=()=>blobDownload(`/documents/${b.dataset.id}/file`,`документ-${b.dataset.id}`));
}
function showExtraction(r){
  const f=r.data.fields||{}; const rows=Object.entries(f).map(([k,v])=>`<tr><td class="muted">${esc(k)}</td><td class="strong">${esc(v)}</td></tr>`).join('');
  const conf=Math.round((r.data.overall_confidence||0)*100);
  document.getElementById('doc-detail').innerHTML=`<div class="card" style="margin-top:16px;"><div class="card-t"><h3>Разпознати данни</h3><span class="pill ${conf>=75?'s-green':'s-amber'}">увереност ${conf}%</span></div>
    <table><tbody>${rows||`<tr><td class="muted">Няма разпознати полета</td></tr>`}</tbody></table>
    ${r.data.notes?`<div class="hint" style="margin-top:10px;">${esc(r.data.notes)}</div>`:''}</div>`;
  document.getElementById('doc-detail').scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ==================== ЕКИП ==================== */
async function viewTeam(main){
  const members=await api('/members');
  const roleSel=(cur)=>`<select class="role-sel" style="width:auto">${ROLES.map(r=>`<option ${r===cur?'selected':''}>${r}</option>`).join('')}</select>`;
  main.innerHTML=pageH('Екип','Потребители и роли (RBAC)')+`
    <div class="card" style="margin-bottom:16px;"><div class="row">
      <div class="field" style="flex:2"><label>Имейл на регистриран потребител</label><input id="t-email"/></div>
      <div class="field"><label>Роля</label><select id="t-role">${ROLES.map(r=>`<option>${r}</option>`).join('')}</select></div>
      <button id="t-add" class="primary">${ic('plus')}Добави</button></div></div>
    <div class="card"><table><thead><tr><th>Имейл</th><th>Име</th><th>Роля</th><th class="num"></th></tr></thead><tbody>
      ${members.map(m=>`<tr data-id="${m.id}"><td class="strong">${esc(m.email)}</td><td>${esc(m.full_name||'')}</td><td>${roleSel(m.role)}</td><td class="num"><button class="sm rm">Премахни</button></td></tr>`).join('')}
    </tbody></table></div>`;
  document.getElementById('t-add').onclick=async()=>{ try{ await api('/members',{method:'POST',body:{email:document.getElementById('t-email').value,role:document.getElementById('t-role').value}}); toast('Добавен'); viewTeam(main); }catch(e){ toast(e.message,true); } };
  main.querySelectorAll('tbody tr').forEach(tr=>{ const id=tr.dataset.id;
    tr.querySelector('.role-sel').onchange=async(e)=>{ try{ await api(`/members/${id}`,{method:'PATCH',body:{role:e.target.value}}); toast('Ролята е сменена'); }catch(err){ toast(err.message,true); viewTeam(main); } };
    tr.querySelector('.rm').onclick=async()=>{ try{ await api(`/members/${id}`,{method:'DELETE'}); toast('Премахнат'); viewTeam(main); }catch(err){ toast(err.message,true); } }; });
}

/* ==================== ОДИТ ==================== */
async function viewAudit(main){
  const logs=await api('/audit');
  main.innerHTML=pageH('Одитен журнал','Append-only запис на всички промени')+`
    <div class="card">${logs.length?`<table><thead><tr><th>Кога</th><th>Метод</th><th>Път</th><th class="num">Статус</th></tr></thead><tbody>${logs.map(l=>`<tr><td class="muted">${esc(new Date(l.created_at).toLocaleString('bg-BG'))}</td><td><span class="pill s-blue na">${esc(l.method)}</span></td><td>${esc(l.path)}</td><td class="num">${l.status_code<400?`<span class="badge-ok">${l.status_code}</span>`:`<span class="badge-bad">${l.status_code}</span>`}</td></tr>`).join('')}</tbody></table>`:empty('Няма записи.')}</div>`;
}
