/* ==================== КАНТОРА: МОИТЕ КЛИЕНТИ ==================== */
/* Екранът е нарочно над отделния клиент: кантората не работи „един клиент в даден
   момент", а гледа кой какво чака. Затова тук няма X-Company-Id. */
let firmTab='clients';

const TASK_ST={OPEN:'s-blue',IN_PROGRESS:'s-amber',DONE:'s-green',CANCELLED:'s-gray'};
const TASK_ST_BG={OPEN:'За правене',IN_PROGRESS:'В процес',DONE:'Готова',CANCELLED:'Отпаднала'};

async function viewFirm(main){
  const tabs=[['clients','Клиенти'],['tasks','Задачи'],['bulk','Групови действия']];
  main.innerHTML=pageH('Моите клиенти','Всички дружества, до които имаш достъп — какво чака работа и кой е следващият срок')+`
    <div class="tabs" style="margin-bottom:16px;">${tabs.map(([k,l])=>
      `<div class="tab ${firmTab===k?'active':''}" data-tab="${k}">${esc(l)}</div>`).join('')}</div>
    <div id="firm-body">${loading()}</div>`;
  main.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ firmTab=b.dataset.tab; viewFirm(main); });
  const body=document.getElementById('firm-body');
  try{
    if(firmTab==='clients') await firmClients(body);
    else if(firmTab==='tasks') await firmTasks(body);
    else await firmBulk(body);
  }catch(e){ body.innerHTML=empty(e.message); }
}

function dueChip(days){
  if(days===null||days===undefined) return '';
  if(days<0) return `<span class="pill s-red">просрочен с ${Math.abs(days)} дни</span>`;
  if(days===0) return '<span class="pill s-red">днес</span>';
  if(days<=3) return `<span class="pill s-amber">след ${days} дни</span>`;
  return `<span class="pill s-gray na">след ${days} дни</span>`;
}

async function firmClients(box){
  const clients=await api('/firm/clients');
  if(!clients.length){ box.innerHTML=empty('Още нямаш клиенти. Създай дружество или помоли да те добавят в екипа му.'); return; }
  const attention=clients.filter(c=>c.needs_attention).length;
  const soon=clients.filter(c=>c.deadline_soon).length;
  const sum=(k)=>clients.reduce((a,c)=>a+c.totals[k],0);

  box.innerHTML=`
    <div class="kpis" style="margin-bottom:16px;">
      <div class="card kpi"><div class="top"><div><div class="l">Клиенти</div><div class="v">${clients.length}</div></div><div class="chip c-blue">${ic('bank')}</div></div>
        <div class="hint">${attention} с натрупана работа · ${soon} със срок до 3 дни</div></div>
      <div class="card kpi"><div class="top"><div><div class="l">Документи за обработка</div><div class="v">${sum('pending_documents')}</div></div><div class="chip c-violet">${ic('doc')}</div></div></div>
      <div class="card kpi"><div class="top"><div><div class="l">Неосчетоводени операции</div><div class="v">${sum('draft_entries')}</div></div><div class="chip c-amber">${ic('book')}</div></div></div>
      <div class="card kpi"><div class="top"><div><div class="l">Несъгласувани движения</div><div class="v">${sum('unreconciled_transactions')}</div></div><div class="chip c-green">${ic('bank')}</div></div></div>
    </div>
    <div class="card"><div class="card-t"><h3>Клиенти</h3>
      <div class="hint">Подредени по това кой чака най-много — не по азбучен ред.</div></div>
      <div style="overflow-x:auto;"><table><thead><tr><th>Клиент</th><th class="num">Документи</th><th class="num">Чернови</th>
        <th class="num">Банка</th><th class="num">Задачи</th><th>Следващ срок</th><th class="num"></th></tr></thead><tbody>
        ${clients.map(c=>{
          const t=c.totals, d=c.next_deadline;
          const cell=(n)=>n?`<td class="num strong">${n}</td>`:'<td class="num muted-2">—</td>';
          return `<tr${c.needs_attention?' style="background:var(--warn-soft,transparent);"':''}>
            <td class="strong">${esc(c.name)}${c.eik?` <span class="muted-2">${esc(c.eik)}</span>`:''}
              ${c.is_vat_registered?'<span class="pill s-violet na">ДДС</span>':''}</td>
            ${cell(t.pending_documents)}${cell(t.draft_entries)}${cell(t.unreconciled_transactions)}
            <td class="num">${t.open_tasks?`${t.open_tasks}${t.overdue_tasks?` <span class="pill s-red na">${t.overdue_tasks} просрочени</span>`:''}`:'<span class="muted-2">—</span>'}</td>
            <td>${d?`${esc(d.title)}<div class="hint">${esc(d.due_date)} · ${dueChip(d.days_remaining)}</div>`:'<span class="muted-2">няма в следващите 90 дни</span>'}</td>
            <td class="num"><button class="sm firm-open" data-id="${c.company_id}" data-name="${esc(c.name)}">Отвори</button></td></tr>`;
        }).join('')}</tbody></table></div></div>`;

  box.querySelectorAll('.firm-open').forEach(b=>b.onclick=()=>{
    // Превключване на активния клиент — оттук нататък работиш в неговия контекст.
    companyId=b.dataset.id; localStorage.setItem('aifos_company',companyId); accountsCache=null;
    const sel=document.getElementById('company-select'); if(sel) sel.value=companyId;
    toast('Активен клиент: '+b.dataset.name);
    loadMyRole().then(()=>navigate('dashboard'));
  });
}

async function firmTasks(box){
  const [tasks,clients]=await Promise.all([api('/firm/tasks'),api('/firm/clients')]);
  const names={}; clients.forEach(c=>names[c.company_id]=c.name);
  box.innerHTML=`
    <div class="card" style="margin-bottom:16px;"><div class="row">
      <div class="field" style="margin:0;min-width:220px;"><label>Клиент</label>
        <select id="ft-c">${clients.map(c=>`<option value="${c.company_id}">${esc(c.name)}</option>`).join('')}</select></div>
      <button id="ft-gen">${ic('calendar')}Създай задачи от сроковете</button>
      <button id="ft-new" class="primary">${ic('plus')}Нова задача</button>
      <div class="hint" style="align-self:center;">Генерирането е идемпотентно — за един срок се създава най-много една отворена задача.</div>

    <div class="card"><div class="card-t"><h3>Задачи</h3><span class="pill s-gray na">${tasks.length}</span></div>
      ${tasks.length?`<table><thead><tr><th>Клиент</th><th>Задача</th><th>Срок</th><th>Статус</th><th class="num"></th></tr></thead><tbody>
        ${tasks.map(t=>{
          const overdue=t.due_date&&t.status!=='DONE'&&t.status!=='CANCELLED'&&t.due_date<new Date().toISOString().slice(0,10);
          return `<tr><td class="strong">${esc(names[t.company_id]||'—')}</td>
            <td>${esc(t.title)}${t.deadline_key?' <span class="pill s-violet na">срок</span>':''}</td>
            <td>${t.due_date?esc(t.due_date):'<span class="muted-2">—</span>'}${overdue?' <span class="pill s-red na">просрочена</span>':''}</td>
            <td><span class="pill ${TASK_ST[t.status]}">${esc(TASK_ST_BG[t.status]||t.status)}</span></td>
            <td class="num">${t.status!=='DONE'?`<button class="sm ft-done" data-id="${t.id}">Готова</button> `:''}
              <button class="sm ft-del" data-id="${t.id}">Изтрий</button></td></tr>`;

      toast(made.length?`Създадени ${made.length} задачи`:'Няма нови срокове — всичко вече е заведено');
      firmTasks(box);

  document.getElementById('ft-new').onclick=()=>firmTaskForm(clients, box);
  box.querySelectorAll('.ft-done').forEach(b=>b.onclick=async()=>{
    try{ await api(`/firm/tasks/${b.dataset.id}`,{method:'PATCH',body:{status:'DONE'}}); firmTasks(box); }
    catch(e){ toast(e.message,true); } });
  box.querySelectorAll('.ft-del').forEach(b=>b.onclick=async()=>{
    try{ await api(`/firm/tasks/${b.dataset.id}`,{method:'DELETE'}); firmTasks(box); }

async function firmBulk(box){
  const now=new Date(); const prev=new Date(now.getFullYear(), now.getMonth()-1, 1);
  const period=`${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,'0')}`;
  box.innerHTML=`
    <div class="card" style="margin-bottom:16px;"><div class="row">
      <div class="field" style="margin:0;min-width:150px;"><label>Данъчен период</label><input id="fb-p" value="${period}" placeholder="ГГГГ-ММ"></div>
      <button id="fb-check" class="primary">${ic('shield')}Провери готовността</button>
      <div class="hint" style="align-self:center;">Показва кой клиент е готов за приключване на ДДС периода.</div>
    </div></div>
    <div id="fb-out"></div>`;
  document.getElementById('fb-check').onclick=async(e)=>{
    const b=e.currentTarget; b.disabled=true; b.textContent='Проверява…';
    const out=document.getElementById('fb-out');
    try{
      const r=await api('/firm/bulk/vat-readiness?period_code='+encodeURIComponent(document.getElementById('fb-p').value));
      out.innerHTML=`<div class="card"><div class="card-t"><h3>Готовност за ${esc(r.period_code)}</h3>
          <div class="flex"><span class="pill s-green na">${r.ready} готови</span>
            <span class="pill s-blue na">${r.closed} приключени</span>
            <span class="pill s-red na">${r.blocked} с пречки</span></div></div>
        <table><thead><tr><th style="width:32px;"></th><th>Клиент</th><th>Състояние</th><th>Пречки</th></tr></thead><tbody>
        ${r.clients.map(c=>`<tr><td>${c.ready?`<input type="checkbox" class="fb-pick" value="${c.company_id}" checked>`:''}</td>
          <td class="strong">${esc(c.name)}</td>
          <td>${c.closed?'<span class="pill s-blue">приключен</span>':c.ready?'<span class="pill s-green">готов</span>':'<span class="pill s-red">има пречки</span>'}</td>
          <td>${c.blockers.length?c.blockers.map(x=>`<div class="hint" style="color:var(--bad)">${esc(x)}</div>`).join(''):
              c.warnings.length?c.warnings.map(x=>`<div class="hint" style="color:var(--warn)">${esc(x)}</div>`).join(''):'<span class="muted-2">—</span>'}</td></tr>`).join('')}
        </tbody></table>
        <div class="flex" style="margin-top:12px;"><button id="fb-dl" class="primary">${ic('download')}Свали пакетите за НАП на отметнатите</button></div>
        <div class="hint" style="margin-top:10px;">${esc(r.note)}</div></div>`;
      document.getElementById('fb-dl').onclick=async()=>{
        const ids=[...document.querySelectorAll('.fb-pick:checked')].map(x=>x.value);
        if(!ids.length){ toast('Отметни поне един клиент',true); return; }
        const res=await fetch(API+'/firm/bulk/nap-packages',{method:'POST',
          headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
          body:JSON.stringify({company_ids:ids, period_code:r.period_code})});
        if(!res.ok){ toast('Грешка при генериране',true); return; }
        const inc=res.headers.get('X-Packages-Included'), skip=res.headers.get('X-Packages-Skipped');
        const url=URL.createObjectURL(await res.blob()); const a=document.createElement('a');
        a.href=url; a.download=`NAP-${r.period_code.replace('-','')}.zip`; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),60000);
        toast(`Свалени ${inc} пакета${Number(skip)?`, пропуснати ${skip}`:''}`);
      };
    }catch(err){ toast(err.message,true); }
    finally{ b.disabled=false; b.innerHTML=ic('shield')+'Провери готовността'; } };
}

/* ==================== ЕКИП ==================== */
async function viewTeam(main){
  const members=await api('/members');
  const roleSel=(cur)=>`<select class="role-sel" style="width:auto">${ROLES.map(r=>`<option ${r===cur?'selected':''}>${r}</option>`).join('')}</select>`;
  main.innerHTML=pageH('Екип','Потребители и роли (RBAC)')+`
    <div class="card" style="margin-bottom:16px;"><div class="row">
      <div class="field" style="flex:2"><label>Имейл на регистриран потребител</label><input id="t-email"/></div>
      <div class="field"><label>Роля</label><select id="t-role">${ROLES.map(r=>`<option>${r}</option>`).join('')}</select></div>
      <button id="t-add" class="primary">${ic('plus')}Добави</button></div></div>
    <div class="card"><table><thead><tr><th>Имейл</th><th>Име</th><th>Роля</th><th class="num"></th></tr></thead><tbody>
      ${members.map(m=>`<tr data-id="${m.id}"><td class="strong">${esc(m.email)}</td><td>${esc(m.full_name||'')}</td><td>${roleSel(m.role)}</td><td class="num"><button class="sm rm">Премахни</button></td></tr>`).join('')}
    </tbody></table></div>`;
  document.getElementById('t-add').onclick=async()=>{ try{ await api('/members',{method:'POST',body:{email:document.getElementById('t-email').value,role:document.getElementById('t-role').value}}); toast('Добавен'); viewTeam(main); }catch(e){ toast(e.message,true); } };
  main.querySelectorAll('tbody tr').forEach(tr=>{ const id=tr.dataset.id;
    tr.querySelector('.role-sel').onchange=async(e)=>{ try{ await api(`/members/${id}`,{method:'PATCH',body:{role:e.target.value}}); toast('Ролята е сменена'); }catch(err){ toast(err.message,true); viewTeam(main); } };
    tr.querySelector('.rm').onclick=async()=>{ try{ await api(`/members/${id}`,{method:'DELETE'}); toast('Премахнат'); viewTeam(main); }catch(err){ toast(err.message,true); } }; });
}

/* ==================== АДМИНИСТРАЦИЯ: РОЛИ И ПРАВА ==================== */
let adminRoleId=null;
async function viewAdmin(main){
  let access={};
  try{ access=await api('/rbac/my-access'); }catch{}
  main.innerHTML=pageH('Роли и права','Кой какво може да прави и кой има достъп от мобилното приложение',
    access.is_admin?`<button id="ad-seed">Създай предефинираните роли</button><button id="ad-new" class="primary">${ic('plus')}Нова роля</button>`:'')
    +`${access.is_admin?'':`<div class="card" style="margin-bottom:16px;">${empty('Само администратор управлява роли. Обърни се към администратор на дружеството.')}</div>`}
    <div class="cols-3"><div id="ad-roles">${loading()}</div><div id="ad-detail"></div></div>`;
  if(access.is_admin){
    document.getElementById('ad-seed').onclick=async()=>{
      try{ await api('/rbac/roles/seed',{method:'POST'}); toast('Предефинираните роли са създадени'); viewAdmin(main); }catch(e){ toast(e.message,true); } };
    document.getElementById('ad-new').onclick=()=>roleForm(null);
  }
  loadRoles();
}
async function loadRoles(){
  const box=document.getElementById('ad-roles'); if(!box) return;
  let roles=[], members=[];
  try{ roles=await api('/rbac/roles'); }catch(e){ box.innerHTML=`<div class="card">${empty(e.message)}</div>`; return; }
  try{ members=await api('/members'); }catch{}
  const count=r=>members.filter(m=>m.role_id===r.id).length;
  box.innerHTML=`<div class="card"><div class="card-t"><h3>Роли</h3><span class="pill s-gray na">${roles.length}</span></div>
    ${roles.length?`<table><thead><tr><th>Роля</th><th>Права</th><th>Мобилно</th><th>Хора</th><th class="num"></th></tr></thead><tbody>
      ${roles.map(r=>`<tr${r.is_active?'':' style="opacity:.5"'}>
        <td><div class="strong">${esc(r.name)}</div><div class="hint">${esc(r.code)}${r.is_system?' · системна':''}${r.is_admin?' · админ':''}</div></td>
        <td>${r.permissions.includes('*')?'<span class="pill s-violet">пълни права</span>':`<span class="pill s-gray na">${r.permissions.length}</span>`}</td>
        <td>${r.can_use_mobile?'<span class="pill s-green">да</span>':'<span class="pill s-gray na">не</span>'}</td>
        <td>${count(r)||'<span class="muted-2">—</span>'}</td>
        <td class="num"><button class="sm ad-open" data-id="${r.id}">Отвори</button></td></tr>`).join('')}</tbody></table>`
      :empty('Няма роли. Натисни „Създай предефинираните роли".')}</div>`;
  box.querySelectorAll('.ad-open').forEach(b=>b.onclick=()=>showRole(roles.find(x=>x.id===b.dataset.id), members));
  if(adminRoleId){ const r=roles.find(x=>x.id===adminRoleId); if(r) showRole(r, members); }
}
async function showRole(role, members){
  adminRoleId=role.id;
  const box=document.getElementById('ad-detail'); if(!box) return;
  box.innerHTML=loading();
  let groups=[], access={};
  try{ [groups,access]=await Promise.all([api('/rbac/permissions'),api('/rbac/my-access')]); }catch{}
  const full=role.permissions.includes('*');
  const has=c=>full||role.permissions.includes(c);
  const editable=access.is_admin && !role.is_system;
  const assigned=(members||[]).filter(m=>m.role_id===role.id);
  box.innerHTML=`<div class="card stack">
    <div class="card-t"><div><h3>${esc(role.name)}</h3><div class="hint">${esc(role.description||'')}</div></div>
      <div class="flex">${role.is_system?'<span class="pill s-blue na">системна</span>':''}${role.is_active?'':'<span class="pill s-gray">неактивна</span>'}</div></div>
    ${access.is_admin?`<div class="row" style="align-items:center;">
      <label class="flex" style="gap:8px;cursor:pointer;font-size:13.5px;color:var(--ink-2);">
        <input type="checkbox" id="ad-mobile" ${role.can_use_mobile?'checked':''} style="width:auto"/>Достъп от мобилното приложение</label>
      <label class="flex" style="gap:8px;cursor:pointer;font-size:13.5px;color:var(--ink-2);">
        <input type="checkbox" id="ad-active" ${role.is_active?'checked':''} style="width:auto"/>Активна</label>
      <div class="spacer"></div>
      ${role.is_system?`<button class="sm" id="ad-clone">Клонирай за редакция</button>`:`<button class="sm" id="ad-del">Изтрий</button>`}
    </div>`:''}
    ${full?'<div class="card" style="background:var(--accent-soft);border-color:var(--accent);"><b style="color:var(--accent-ink)">Пълни права</b> — тази роля минава всяка проверка.</div>':''}
    <div>${groups.map(g=>`<div style="margin-bottom:12px;">
      <h4 class="muted" style="margin-bottom:6px;">${esc(g.group)}</h4>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;">
        ${g.permissions.map(p=>`<label class="flex" style="gap:7px;font-size:13px;color:${has(p.code)?'var(--ink-2)':'var(--muted-2)'};${editable?'cursor:pointer;':''}">
          <input type="checkbox" class="ad-perm" value="${p.code}" ${has(p.code)?'checked':''} ${editable&&!full?'':'disabled'} style="width:auto"/>
          <span>${esc(p.label)}</span></label>`).join('')}
      </div></div>`).join('')}</div>
    ${editable&&!full?`<button class="primary" id="ad-save">${ic('check')}Запази правата</button>`:''}
    <div><h4 class="muted" style="margin-bottom:6px;">Хора с тази роля (${assigned.length})</h4>
      ${assigned.length?`<div class="legend">${assigned.map(m=>`<div class="li"><span>${esc(m.email)}</span><span class="hint">${esc(m.full_name||'')}</span></div>`).join('')}</div>`:'<div class="hint">Никой още.</div>'}</div>
  </div>`;
  const patch=async(body)=>{ try{ await api(`/rbac/roles/${role.id}`,{method:'PATCH',body}); toast('Записано'); loadRoles(); }catch(e){ toast(e.message,true); loadRoles(); } };
  document.getElementById('ad-mobile')?.addEventListener('change',e=>patch({can_use_mobile:e.target.checked}));
  document.getElementById('ad-active')?.addEventListener('change',e=>patch({is_active:e.target.checked}));
  document.getElementById('ad-save')?.addEventListener('click',()=>{
    const perms=[...box.querySelectorAll('.ad-perm:checked')].map(c=>c.value);
    patch({permissions:perms}); });
  document.getElementById('ad-clone')?.addEventListener('click',async()=>{
    const name=prompt('Име на новата роля:', role.name+' (копие)'); if(!name) return;
    const code=prompt('Код (латиница, без интервали):', role.code+'_COPY'); if(!code) return;
    try{ const nr=await api(`/rbac/roles/${role.id}/clone`,{method:'POST',body:{code,name}});
      toast('Ролята е клонирана'); adminRoleId=nr.id; loadRoles(); }catch(e){ toast(e.message,true); } });
  document.getElementById('ad-del')?.addEventListener('click',async()=>{
    if(!confirm(`Изтриване на роля „${role.name}"?`)) return;
    try{ await api(`/rbac/roles/${role.id}`,{method:'DELETE'}); toast('Изтрита'); adminRoleId=null; loadRoles(); document.getElementById('ad-detail').innerHTML=''; }
    catch(e){ toast(e.message,true); } });
}
function roleForm(){
  const box=document.getElementById('ad-detail'); if(!box) return;
  box.innerHTML=`<div class="card stack"><h3>Нова роля</h3>
    <div class="row"><div class="field grow"><label>Наименование</label><input id="nr-name" placeholder="напр. Касиер"/></div>
      <div class="field"><label>Код</label><input id="nr-code" placeholder="CASHIER"/></div></div>
    <div class="field"><label>Описание</label><input id="nr-desc"/></div>
    <div class="row"><label class="flex" style="gap:8px;cursor:pointer;font-size:13.5px;"><input type="checkbox" id="nr-mob" style="width:auto"/>Мобилен достъп</label>
      <label class="flex" style="gap:8px;cursor:pointer;font-size:13.5px;"><input type="checkbox" id="nr-adm" style="width:auto"/>Администратор</label></div>
    <div class="hint">Правата се задават след създаването.</div>
    <div class="flex"><button class="primary" id="nr-save">Създай</button><button class="ghost" onclick="document.getElementById('ad-detail').innerHTML=''">Отказ</button></div></div>`;
  document.getElementById('nr-save').onclick=async()=>{
    const body={ name:document.getElementById('nr-name').value, code:document.getElementById('nr-code').value,
      description:document.getElementById('nr-desc').value||null, permissions:[],
      can_use_mobile:document.getElementById('nr-mob').checked, is_admin:document.getElementById('nr-adm').checked };
    if(!body.name||!body.code){ toast('Попълни име и код',true); return; }
    try{ const r=await api('/rbac/roles',{method:'POST',body}); toast('Ролята е създадена'); adminRoleId=r.id; loadRoles(); }
    catch(e){ toast(e.message,true); } };
}

async function viewAudit(main){
  const logs=await api('/audit');
  main.innerHTML=pageH('Одитен журнал','Append-only запис на всички промени')+`
    <div class="card">${logs.length?`<table><thead><tr><th>Кога</th><th>Метод</th><th>Път</th><th class="num">Статус</th></tr></thead><tbody>${logs.map(l=>`<tr><td class="muted">${esc(new Date(l.created_at).toLocaleString('bg-BG'))}</td><td><span class="pill s-blue na">${esc(l.method)}</span></td><td>${esc(l.path)}</td><td class="num">${l.status_code<400?`<span class="badge-ok">${l.status_code}</span>`:`<span class="badge-bad">${l.status_code}</span>`}</td></tr>`).join('')}</tbody></table>`:empty('Няма записи.')}</div>`;
}
