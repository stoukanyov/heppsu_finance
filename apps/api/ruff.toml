# Линтерът пази от грешки, не налага стил.
#
# Съзнателно НЕ включваме форматиращите правила (E501 дължина на реда, E741
# имена от една буква, E702 точка и запетая): те биха дали стотици промени в
# код, който вече работи, и всяка такава промяна е риск без полза. Тук остават
# правилата, които хващат истински дефекти — недефинирани имена, мъртви
# импорти, изключения, които губят причината си.

line-length = 120
target-version = "py312"

[lint]
select = [
    "F",    # pyflakes — недефинирани имена, неизползвани импорти
    "E9",   # синтактични грешки и грешки при изпълнение
    "W",    # празни редове с интервали и подобни
    "B",    # bugbear — капани, които типовата проверка не хваща
    "UP",   # остарял синтаксис спрямо целевата версия на Python
    "SIM",  # излишно усложнени конструкции
    "I",    # подредба на импортите
    # Правилата на bandit, но пуснати при всяко записване, а не веднъж в CI.
    # Системата държи счетоводни данни на клиенти: вградена тайна, подпис сравнен
    # с `==`, SQL слепен от низове или `urlopen` с непроверена схема са точно
    # класът грешки, който тук струва скъпо.
    "S",
    # Блокиращо действие вътре в `async` — при FastAPI това спира ЦЕЛИЯ event loop,
    # не само текущата заявка. Проявява се като „приложението е бавно“ под
    # натоварване, а причината е един ред.
    "ASYNC",
    # Дата/час без часова зона. `date.today()` връща деня по часовника на сървъра
    # (UTC), а фирмата живее в Europe/Sofia — между полунощ и 03:00 това е ДРУГ
    # ден и осчетоводеното попада в предходния данъчен период. Виж
    # `app/core/clock.py`.
    "DTZ",
]
ignore = [
    # FastAPI-специфично: `Depends(...)` в стойност по подразбиране е самата
    # идиома на рамката, не капан.
    "B008",
    # `raise ... from` — правилно е, но пипането на 9 места в работещ код
    # носи повече риск, отколкото полза. Ако някога преработваме грешките,
    # това е първото за включване.
    "B904",
    # `class X(str, Enum)` → `StrEnum` не е чиста замяна: `str(X.A)` връща
    # "X.A" при първото и "A" при второто. Наследените стойности се сериализират
    # от Pydantic и се пишат в базата — тиха промяна там значи повредени данни.
    "UP042",
    # Тернарният оператор невинаги е по-ясен: на няколко места двата клона носят
    # обяснителен коментар („европейски формат 1.234,56“ срещу „1,234.56“), който
    # при сливане в един ред няма къде да отиде.
    "SIM108",
    # `assert` е самата форма на теста. Включено глобално, а не само за `tests/`,
    # защото иначе всеки помощен файл извън папката трябва да се изброява.
    "S101",
]

[lint.per-file-ignores]
# Миграциите се генерират от Alembic — форматът им не е наш избор.
"alembic/versions/*" = ["E", "F", "I", "UP", "W", "S", "DTZ"]

# ── Изключения по правилото S (сигурност) ────────────────────────────────────
# S105 „вградена парола“ по ИМЕТО на константата. Стойността е безобидна, а
# истинската защита е другаде: валидаторът в същия файл вдига
# `InsecureConfigurationError` и ОТКАЗВА да пусне приложението с ключа по
# подразбиране в production/staging (пази се от `tests/test_security_config.py`).
"app/core/config.py" = ["S105"]
# `token_type: "bearer"` — дума от OAuth2 спецификацията, не тайна.
"app/modules/identity/schemas.py" = ["S105"]

# Тестовете нарочно съдържат пароли и низове, които приличат на тайни — това е
# предметът им. Стойностите са измислени и не отварят нищо.
"tests/*" = [
    "S105", "S106", "S107",
    # S314: тестовете парсват XML, който САМИ са генерирали един ред по-горе.
    # Няма външен вход, който да е злонамерен. Кодът на приложението парсва
    # чужди файлове с `defusedxml` — там правилото остава в сила.
    "S314",
    # S608: `test_migrations_schema.py` сглобява заявка към системния каталог с
    # име на таблица, което идва от самата схема, а не от потребител.
    "S608",
    # DTZ: тестовете фиксират календарни дати нарочно, за да са детерминирани.
    "DTZ",
]
