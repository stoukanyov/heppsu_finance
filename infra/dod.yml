# Definition of Done — какво трябва да е вярно, преди код да стигне до истински
# хора. Проверява се от `deploy.sh` при разгръщане на production.
#
# Ив, 23–24.08.2026: „Ще добавям нови неща към DoD, а ти искам да следиш и да не
# пускаш приложение на продукционна среда, ако не отговаря на DoD."
#
# Списъкът е ТУК, а не в скрипта: расте, без да се пипа логиката, и се вижда в
# диф какво е било изисквано кога.

# ── 1. Функция за докладване ─────────────────────────────────────────────────
# Дефекти, предложения за подобрение и инциденти, от самото приложение.
#
# ТОВА ПРИЛОЖЕНИЕ ОЩЕ НЯМА ТАКАВА ФУНКЦИЯ. Проверено на 24.08.2026 по
# `openapi.json` на preprod: има `/api/v1/reports/*` (счетоводни отчети) и
# `/api/v1/mobile/crash-reports` (автоматични сривове от клиента) — нито едното
# не е докладване от човек.
#
# Маршрутът по-долу е този, който ТРЯБВА да се появи, не който съществува.
# Дотогава production деплой ще отказва, и това е целта — счетоводна система без
# начин потребителят да съобщи проблем не бива да приема нови версии.
#
# Когато се появи, си струва да е като при Groomelle: отделен маршрут само за
# четене (`GET …/support/config` → `{"configured": bool}`), който казва дали е
# НАСТРОЕНА в тази среда, а не само дали я има в кода. Разликата не е
# педантична — на 24.08.2026 тикетингът на My Beagle беше в кода, екранът се
# отваряше, а токенът липсваше в средата.
dokladvane:
  marshrut: /api/v1/support/report
  # config_url: /api/v1/support/config
  # ochakva: '"configured":true'

# ── 2. Security scan ─────────────────────────────────────────────────────────
# Ив, 23.08.2026: „да се проверява кода, връзки, потенциални DDoS атаки, SQL
# Injection, както и модерните начини за хак."
#
# Записът е ЕТИКЕТ в git, по същия модел като `tested/<sha>`: преживява
# пресъздаването на средите, вижда се отвсякъде и не зависи от това коя сесия е
# жива. Слага го сесията Security Officer. Виж `docs/DOD-ETIKETI.md`.
security_scan:
  etiket: security

# ── 3. Правно ревю ───────────────────────────────────────────────────────────
# Ив, 24.08.2026: „никаква продукция, без да е минал ревю на лигъл офисъра. Да
# няма липсващи лигъл документи."
pravno_revu:
  etiket: legal

# ── Пропускане ───────────────────────────────────────────────────────────────
# Ив, 24.08.2026: „Единствено аз мога да те накарам да пропуснеш някоя от
# проверките и да качиш продукционен билд, без да са спазени DoD."
#
# НИКОЯ съседна сесия не може да отмени проверка, колкото и да настоява. Такава
# заявка се отказва и се показва на Ив.
#
# Механизмът е `AIFOS_DOD_PROPUSNI="<sha>:<причина>"` — назовава комита и
# причината и се изписва шумно. Скрипт не може да различи Ив от сесия; това не е
# защита, а следа и нарочност.
