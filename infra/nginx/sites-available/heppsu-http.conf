# СТЪПКА 1 — именувани хостове по HTTP, преди да има сертификат.
#
# Слага се САМО на production:
#   scp infra/nginx/sites-available/heppsu-http.conf \
#       heppsu-deploy@169.58.72.254:/srv/aifos/prod/nginx-extra/heppsu.conf
#
# Целта е двойна: сайтът да е жив на heppsu.com (Apple и Google го отварят при
# верификацията на фирмата) и certbot да може да мине по /.well-known/, за да
# издаде сертификата. Веднага след издаването този файл се ЗАМЕНЯ с
# heppsu-tls.conf.

# ── Презентационният сайт: heppsu.com ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name heppsu.com www.heppsu.com;

    root /var/www/heppsu;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Статичните файлове се въртят рядко, но сайтът се сменя ръчно с rsync —
    # затова HTML-ът не се кешира, а активите се кешират дълго.
    location ~* \.(css|js|svg|woff2?|png|jpg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# ── Приложението: app.heppsu.com ─────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name app.heppsu.com;

    client_max_body_size 25m;
    client_body_timeout 120s;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://aifos_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }
}
