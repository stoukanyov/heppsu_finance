# СТЪПКА 2 — същите хостове, но с HTTPS. Слага се СЛЕД като certbot е издал
# сертификата за трите имена (heppsu.com, www.heppsu.com, app.heppsu.com).
#
#   scp infra/nginx/sites-available/heppsu-tls.conf \
#       heppsu-deploy@169.58.72.254:/srv/aifos/prod/nginx-extra/heppsu.conf
#
# ВНИМАНИЕ: ако сертификатът още не е издаден, nginx НЕ ТРЪГВА — пътищата по-долу
# сочат към файлове, които няма да съществуват. Първо certbot, после този файл.

# ── HTTP: само проверката на Let's Encrypt, всичко друго отива на HTTPS ──────
server {
    listen 80;
    listen [::]:80;
    server_name heppsu.com www.heppsu.com app.heppsu.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── www → голия домейн ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.heppsu.com;

    ssl_certificate     /etc/letsencrypt/live/heppsu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heppsu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://heppsu.com$request_uri;
}

# ── Презентационният сайт ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name heppsu.com;

    ssl_certificate     /etc/letsencrypt/live/heppsu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heppsu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /var/www/heppsu;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg|woff2?|png|jpg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

# ── AI Finance OS ────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.heppsu.com;

    ssl_certificate     /etc/letsencrypt/live/heppsu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heppsu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    client_max_body_size 25m;
    client_body_timeout 120s;

    # Финансови данни: без вграждане в чужди страници и без изтичане на referrer.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://aifos_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 180s;          # AI анализите могат да са бавни
        proxy_send_timeout 180s;
        proxy_buffering off;              # за streaming отговори
    }
}
