# СТЪПКА 2 — същите хостове, но с HTTPS. Слага се СЛЕД като certbot е издал
# сертификата за трите имена (heppsu.com, www.heppsu.com, app.heppsu.com).
#
#   scp infra/nginx/sites-available/heppsu-tls.conf \
#       heppsu-deploy:/srv/aifos/prod/nginx-extra/heppsu.conf
#
# ВНИМАНИЕ: ако сертификатът още не е издаден, nginx НЕ ТРЪГВА — пътищата по-долу
# сочат към файлове, които няма да съществуват. Първо certbot, после този файл.

# ── Кеширане по вид на файла ─────────────────────────────────────────────────
#
# Защо през `map`, а не с `add_header` в location блок: в nginx `add_header` в
# location ОТМЕНЯ всички наследени `add_header` от server блока. Докато
# Cache-Control се даваше от location, петте заглавки за сигурност по-долу
# излизаха само на 404 — единственият отговор без съвпадащ location. Тук няма
# нито един `add_header` в location, затова наследяването не се къса.
#
# `immutable` е само за неща с непроменящо се съдържание. `style.css` и `main.js`
# нямат хеш в името си — с `immutable` браузър, който е бил на сайта, ще държи
# стария файл до изтичане на срока и няма да види поправка. Затова те са с кратък
# срок и задължителна проверка, докато в имената им не влезе версия.
map $uri $heppsu_cache {
    default                                    "no-cache";
    ~*\.html$                                  "no-cache";
    ~*\.(?:css|js)$                            "public, max-age=3600, must-revalidate";
    ~*\.(?:svg|woff2?|png|jpe?g|webp|ico)$     "public, max-age=2592000, immutable";
}

# ── TLS: едно място за трите имена ───────────────────────────────────────────
#
# На ниво http (този файл се включва от aifos.conf в http контекста), за да не
# може нов server блок да забрави шифрите. Одит 09–11.10.2026: блокът на
# app.heppsu.com нямаше `ssl_ciphers` и приемаше подразбиращия се списък — CBC с
# HMAC-SHA1, ARIA, CAMELLIA.
#
# Mozilla Server Side TLS 6.0, „intermediate“ (ssl-config.mozilla.org): само
# ECDHE с AEAD за TLS 1.2; TLS 1.3 си има свои и не се пипат. DHE не влиза —
# 6.0 го махна, а и nginx без `ssl_dhparam` не го ползва. `ssl_ecdh_curve` не се
# задава: подразбиращото се в OpenSSL 3.5 включва и X25519MLKEM768, а изрично
# изброяване, което го пропусне, би го изключило.
#
# `ssl_stapling` го няма нарочно: Let's Encrypt спря OCSP (сертификатите нямат
# OCSP адрес) и директивата даваше само предупреждение при всяко зареждане.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# ── Всичко без наше име: затваря се ─────────────────────────────────────────
#
# Заявка по голия IP или с чуждо Host/SNI не получава нищо — нито API-то, нито
# пренасочване, нито сертификата (който изброява имената ни). Правилото на Ив:
# никой порт навън без DNS+TLS. Одит 11.10.2026: голият IP по HTTP връщаше
# API-то на всяко Host, а https://<IP> пренасочваше към www.
#
# `default_server` е само тук. aifos.conf (общ за всички среди) нарочно е без
# флага — два на един порт и nginx не тръгва.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;             # затваря връзката без отговор
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;  # TLS се отказва още на SNI; сертификат не трябва
}

# ── HTTP: само проверката на Let's Encrypt, всичко друго отива на HTTPS ──────
#
# Подновяването е `certbot renew --webroot` (контейнерът certbot, на 12 часа) по
# http-01: Let's Encrypt идва на 80 с Host на нашите имена и стига ТУК, не до
# подразбиращия се сървър горе.
server {
    listen 80;
    listen [::]:80;
    server_name heppsu.com www.heppsu.com app.heppsu.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── www → голия домейн ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.heppsu.com;

    ssl_certificate     /etc/letsencrypt/live/heppsu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heppsu.com/privkey.pem;

    # И пренасочването носи HSTS — иначе браузър, който влиза първо през www,
    # научава правилото един отговор по-късно от нужното.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://heppsu.com$request_uri;
}

# ── Презентационният сайт ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name heppsu.com;

    ssl_certificate     /etc/letsencrypt/live/heppsu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heppsu.com/privkey.pem;

    root /var/www/heppsu;
    index index.html;

    # Страниците са на кирилица, а Content-Type беше `text/html` без charset —
    # браузърът разчиташе само на <meta charset>.
    charset utf-8;
    # text/html се обработва винаги — изброена изрично, дава предупреждение за дубликат.
    charset_types text/css text/plain text/xml application/xml application/javascript image/svg+xml;

    # Без компресия HTML, CSS и JS вървяха с пълния си размер. Тайни в тези
    # отговори няма (статичен сайт без бисквитки), затова BREACH не е риск.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css text/plain text/xml application/xml application/javascript image/svg+xml;

    # Брандирана страница вместо стандартната на nginx. Ако файлът липсва,
    # nginx връща своята — нищо не се чупи.
    error_page 404 /404.html;

    # ВСИЧКИ заглавки са на ниво server и никъде по-долу няма `add_header` —
    # това е условието те да излизат на всеки отговор, не само на 404.
    #
    # Cache-Control БЕЗ `always`: тогава nginx го слага само на успешни отговори
    # и пренасочвания. С `always` и 404 на адрес като /x.png получаваше
    # „immutable" за 30 дни — браузърът помнеше липсата дори след като файлът
    # бъде качен (одит 09.10.2026).
    add_header Cache-Control $heppsu_cache;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Сайтът е статичен, без нито един вграден `<script>`, `<style>` или
    # `style="..."` — затова политиката може да е строга, без 'unsafe-inline'.
    # Двете изключения са Google Fonts: CSS-ът идва от fonts.googleapis.com,
    # самите шрифтове от fonts.gstatic.com. Тази политика е за САЙТА;
    # `app.heppsu.com` е приложение и иска своя.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Страницата не отваря прозорци към чужд сайт и чужд сайт не я вгражда като
    # ресурс. Не чупи нищо: сайтът няма pop-up и не се вгражда никъде.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-site always;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ── AI Finance OS ────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.heppsu.com;

    ssl_certificate     /etc/letsencrypt/live/heppsu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heppsu.com/privkey.pem;

    client_max_body_size 25m;
    client_body_timeout 120s;

    # Финансови данни: без вграждане в чужди страници и без изтичане на referrer.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Само `frame-ancestors` — то дублира X-Frame-Options за нови браузъри и не
    # може да счупи нищо. Пълна CSP за приложението (script-src, connect-src)
    # изисква да се знае какво зарежда самият интерфейс; тя се добавя, когато
    # сесията по приложението потвърди списъка, а не на предположение.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location / {
        proxy_pass http://aifos_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, не $proxy_add_x_forwarded_for — виж aifos.conf.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 180s;          # AI анализите могат да са бавни
        proxy_send_timeout 180s;
        proxy_buffering off;              # за streaming отговори
    }
}
