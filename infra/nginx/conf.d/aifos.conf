# Reverse proxy за AI Finance OS.
#
# Този файл важи за ВСИЧКИ среди (prod, pre-prod, demo) и затова НЕ споменава
# домейн. Блокът по-долу хваща заявките по IP там, където е ЕДИНСТВЕНИЯТ сървър:
# pre-prod на 8080 и demo на 8081 (Deimos, без име и сертификат).
#
# На production НЕ проксира нищо: `heppsu-tls.conf` в nginx-extra обявява свой
# `default_server` на 80 и 443, който затваря връзката (444 / отказ на TLS).
# Изричният `default_server` печели пред първия по ред блок, затова тук флагът
# НЕ стои — два `default_server` на един порт и nginx не тръгва. Одит 11.10.2026:
# `curl -H 'Host: evil.example' http://169.58.72.254/api/v1/health` връщаше 200,
# а правилото на Ив е никой порт навън без DNS+TLS. Мобилното приложение в
# production сочи към https://app.heppsu.com, не към IP.
#
# Именуваните хостове (heppsu.com, app.heppsu.com) и сертификатите са СПЕЦИФИЧНИ
# ЗА СРЕДАТА и затова не стоят тук, а се пускат само на production през
# `/srv/aifos/prod/nginx-extra/` — виж `infra/nginx/sites-available/` и раздел
# „Домейн и HTTPS“ в infra/README.md. Ако TLS блок с път до сертификат влезе в
# този файл, pre-prod и demo спират да тръгват, защото при тях такъв файл няма.

# Версията на nginx не излиза в `Server` и в страниците за грешка — безплатна
# подсказка кои бюлетини да се пробват. На ниво http, за всички среди и хостове.
server_tokens off;

upstream aifos_api {
    server api:8000;
    keepalive 32;
}

# Общи настройки за проксиране към приложението.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # БЕЗ default_server — виж горе. На pre-prod и demo пак е подразбиращият се,
    # защото е единственият; на production го изпреварва изричният в nginx-extra.
    listen 80;
    listen [::]:80;
    # Име, което НИКОЯ заявка не може да има: регулярен израз, който винаги
    # отказва (`(?!)` — празно отрицателно надникване). Не `_`: това е обикновено
    # име, клиентът може да прати `Host: _` и на production щеше да стигне до
    # API-то по чист HTTP, покрай затварящия default_server. А в nginx-extra
    # `_` вече стои на затварящия сървър — две еднакви имена на един порт са
    # „conflicting server name“ и второто се пренебрегва.
    # На pre-prod и demo блокът хваща всичко като ЕДИНСТВЕН сървър на порта,
    # името не е нужно за това.
    server_name ~^(?!)$;

    # Качваните документи са до 25 MB (MAX_UPLOAD_BYTES в приложението).
    client_max_body_size 25m;
    client_body_timeout 120s;

    # Пътят, по който Let's Encrypt проверява собственост върху домейна.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # ── Пренасочване към HTTPS: включва се СЛЕД издаване на сертификата ──
    # location / { return 301 https://$host$request_uri; }

    location / {
        proxy_pass http://aifos_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, не $proxy_add_x_forwarded_for: второто ДОБАВЯ към
        # подаденото от клиента, а uvicorn взимаше най-левия елемент — адресът в
        # одитния дневник се пишеше от нападателя. Пред този nginx няма друг proxy.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 180s;          # AI анализите могат да са бавни
        proxy_send_timeout 180s;
        proxy_buffering off;              # за streaming отговори
    }
}

# ── Специфично за средата: именувани хостове и TLS ───────────────────────────
#
# Празна или липсваща директория тук не е грешка — шаблонът с * просто не
# намира файлове и nginx тръгва без тях. Затова pre-prod и demo не се пипат.
# На production в /srv/aifos/prod/nginx-extra/ се слага един от файловете в
# infra/nginx/sites-available/ (първо -http, после -tls). Виж infra/README.md.
include /etc/nginx/extra/*.conf;
