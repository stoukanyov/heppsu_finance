# Reverse proxy за AI Finance OS.
#
# Докато няма домейн и сертификат, работи само на 80 и обслужва директно.
# След издаване на сертификата се разкоментира HTTPS блокът и се включва
# пренасочването (виж infra/README.md).

upstream aifos_api {
    server api:8000;
    keepalive 32;
}

# Общи настройки за проксиране към приложението.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Качваните документи са до 25 MB (MAX_UPLOAD_BYTES в приложението).
    client_max_body_size 25m;
    client_body_timeout 120s;

    # Пътят, по който Let's Encrypt проверява собственост върху домейна.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # ── Пренасочване към HTTPS: включва се СЛЕД издаване на сертификата ──
    # location / { return 301 https://$host$request_uri; }

    location / {
        proxy_pass http://aifos_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 180s;          # AI анализите могат да са бавни
        proxy_send_timeout 180s;
        proxy_buffering off;              # за streaming отговори
    }
}

